<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晚间学习 Agent</title><script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script><style>
:root{--bg:#142536;--paper:#fbf8f1;--ink:#17202a;--muted:#73808a;--gold:#e8a33a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Songti SC',serif}body:before{content:"";position:fixed;inset:0;opacity:.15;pointer-events:none;background-image:radial-gradient(#fff .6px,transparent .6px);background-size:9px 9px}.shell{max-width:1160px;margin:auto;padding:38px 28px 72px}.top{display:flex;justify-content:space-between;color:#eef3f1;margin-bottom:50px}.eyebrow,.label,.num{font:12px sans-serif;letter-spacing:.16em;text-transform:uppercase}.eyebrow{color:#eab263}.brand{font-size:28px;margin-top:10px}.quote{color:#b9c5c7;text-align:right;line-height:1.7;font-size:14px}.hero{display:grid;grid-template-columns:1fr 350px;gap:28px;align-items:end;margin-bottom:28px}.hero h1{font-size:clamp(40px,6vw,72px);line-height:.98;color:var(--paper);font-weight:400;letter-spacing:-.05em;margin:0}.hero p{color:#b6c4c6;line-height:1.8;max-width:580px;font-size:17px}.panel{background:#20394a;border:1px solid #365266;border-radius:18px;padding:18px}.label{display:block;color:#aebfc3;margin-bottom:9px}.row{display:flex;gap:8px}.select{flex:1;min-width:0;background:#172b3b;color:#fff;border:1px solid #506a78;border-radius:9px;padding:12px}.primary,.submit{border:0;border-radius:9px;padding:12px 16px;cursor:pointer}.primary{background:var(--gold);font-weight:bold}.primary:disabled,.submit:disabled{opacity:.55;cursor:wait}.content{background:var(--paper);border-radius:24px;padding:clamp(25px,5vw,56px);min-height:520px;box-shadow:0 24px 80px #08131c66}.meta{color:var(--muted);font:12px sans-serif;letter-spacing:.08em;text-transform:uppercase}.dot{display:inline-block;width:8px;height:8px;background:var(--gold);border-radius:50%;margin-right:8px}.content h2{font-size:clamp(30px,4vw,48px);font-weight:400;line-height:1.15;max-width:800px;margin:18px 0 28px}.article{font-size:18px;line-height:2;max-width:800px;border-left:3px solid #edc47f;padding-left:22px;color:#38434a}.questions{display:grid;gap:22px;max-width:820px;margin-top:52px}.question{border-top:1px solid #e7dfd2;padding-top:18px}.num{color:#bb7b22}.question p{font-size:19px;line-height:1.55}.question textarea{width:100%;min-height:110px;border:1px solid #e7dfd2;border-radius:10px;padding:13px;background:#fffdfa;line-height:1.7}.submit{margin-top:28px;background:var(--bg);color:#fff}.result{margin-top:32px;padding:22px;background:#edf2eb;border-radius:14px}.score{font-size:38px;color:#3d724d}.review{border-top:1px solid #d8e2d6;padding-top:18px;margin-top:18px}.review h3{font-size:18px;margin:0 0 8px}.review p{line-height:1.7;white-space:pre-wrap}.method{font-size:14px;color:#52665a}.loading{text-align:center;color:var(--muted);padding:150px 0}.spinner{display:inline-block;width:28px;height:28px;border:3px solid #e9dfcd;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error{color:#b85c4a;background:#faece8;padding:14px;border-radius:10px}@media(max-width:760px){.shell{padding:24px 16px 48px}.quote{display:none}.hero{grid-template-columns:1fr}.content{padding:24px 20px;border-radius:18px}}
</style></head><body><div id="app" class="shell"><header class="top"><div><div class="eyebrow">Personal Learning Agent</div><div class="brand">今晚，向前一点。</div></div><div class="quote">不积跬步，无以至千里。<br>每一次认真回答，都会留下路。</div></header><section class="hero"><div><h1>给自己一小时，<br>学会一件事。</h1><p>Agent 会从技术世界里挑出值得今天理解的内容，再用三个问题确认它真的进入了你的脑子。</p></div><div class="panel"><label class="label">今晚想练什么</label><div class="row"><select class="select" v-model="track"><option value="">Agent 自动推荐</option><optgroup label="Java 与 Spring"><option value="JAVA">Java 基础</option><option value="JAVA_COLLECTIONS">集合与泛型</option><option value="JAVA_CONCURRENCY">并发编程</option><option value="JVM">JVM</option><option value="SPRING">Spring / Spring Boot</option></optgroup><optgroup label="基础与架构"><option value="DATA_STRUCTURES">数据结构与算法</option><option value="OPERATING_SYSTEMS">操作系统</option><option value="COMPUTER_NETWORKS">计算机网络</option><option value="DATABASE">数据库</option><option value="ARCHITECTURE">系统架构</option><option value="DISTRIBUTED_SYSTEMS">分布式系统</option></optgroup><optgroup label="中间件"><option value="REDIS">Redis</option><option value="KAFKA">Kafka</option><option value="ROCKETMQ">RocketMQ</option></optgroup><optgroup label="AI"><option value="AI">AI 基础</option><option value="MACHINE_LEARNING">机器学习</option><option value="LLM">大语言模型</option><option value="RAG">RAG</option><option value="AI_AGENT">AI Agent</option><option value="AI_TOOLS">AI 工具</option><option value="MODEL_UPDATES">最新模型</option></optgroup></select><button class="primary" @click="load" :disabled="loading">{{loading?'准备中…':'开始练习'}}</button></div></div></section><main class="content"><div v-if="loading" class="loading"><span class="spinner"></span><p>Agent 正在为你准备今晚的内容…</p></div><div v-else-if="error" class="error">{{error}}</div><template v-else><div class="meta"><span class="dot"></span>{{trackName(session.track)}} · 今日学习</div><h2>{{session.title}}</h2><div class="article">{{session.article}}</div><section class="questions"><div class="question" v-for="(q,i) in session.questions" :key="i"><div class="num">QUESTION 0{{i+1}}</div><p>{{q.prompt}}</p><textarea v-model="answers[i]" placeholder="写下你的理解，尽量说出原因或例子…"></textarea></div></section><button class="submit" @click="submit" :disabled="submitting">{{submitting?'DeepSeek 正在认真批改…':done?'重新批改并查看参考答案':'提交答案，看看自己掌握了多少'}}</button><div v-if="result" class="result"><div>今天的结果</div><div class="score">{{result.session.score}} 分</div><p class="method">{{result.scoringMethod}}</p><div class="review" v-for="(item,i) in result.questions" :key="i"><h3>第 {{i+1}} 题 · {{item.score}} 分</h3><p><strong>你的回答：</strong>{{item.answer||"未作答"}}</p><p><strong>评分原因：</strong>{{item.feedback||"暂无逐题评语"}}</p><p><strong>参考答案：</strong>{{item.referenceAnswer||"旧成绩暂无参考答案；重新提交可获取。"}}</p></div></div></template></main></div><script>const{createApp}=Vue;createApp({data:()=>({track:'',session:null,answers:[],result:null,loading:true,submitting:false,done:false,error:''}),mounted(){this.load()},methods:{trackName(t){return({JAVA:'Java 基础',JAVA_COLLECTIONS:'集合与泛型',JAVA_CONCURRENCY:'并发编程',JVM:'JVM',SPRING:'Spring / Spring Boot',DATA_STRUCTURES:'数据结构与算法',OPERATING_SYSTEMS:'操作系统',COMPUTER_NETWORKS:'计算机网络',DATABASE:'数据库',ARCHITECTURE:'系统架构',DISTRIBUTED_SYSTEMS:'分布式系统',REDIS:'Redis',KAFKA:'Kafka',ROCKETMQ:'RocketMQ',AI:'AI 基础',MACHINE_LEARNING:'机器学习',LLM:'大语言模型',RAG:'RAG',AI_AGENT:'AI Agent',AI_TOOLS:'AI 工具',MODEL_UPDATES:'最新模型'})[t]||t},async load(){this.loading=true;this.error='';this.result=null;this.done=false;try{let u=this.track?'/api/learning/start?track='+this.track:'/api/learning/start';let r=await fetch(u);if(!r.ok)throw Error();this.session=await r.json();this.answers=Array(this.session.questions.length).fill('');if(this.session.completed){let review=await fetch('/api/learning/evaluation');if(review.ok){this.result=await review.json();this.done=true;this.answers=this.result.questions.map(q=>q.answer||'')}}}catch(e){this.error='内容加载失败，请确认 Agent 正在运行后重试。'}finally{this.loading=false}},async submit(){this.submitting=true;try{let r=await fetch('/api/learning/evaluate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers:this.answers})});if(!r.ok)throw Error();this.result=await r.json();this.done=true}catch(e){this.error='批改失败，请稍后再试。'}finally{this.submitting=false}}}}).mount('#app')</script></body></html>
